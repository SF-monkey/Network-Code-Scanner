<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1318">
<title>Barcode Sender</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="phone.css">
</head>
<body class="phone">
<main class="app">
  <section class="pv">
    <video id="preview" autoplay muted playsinline></video>
    <span class="ph" id="ph">The camera preview appears here</span>
    <div class="status"><span class="dot" id="dot" data-state="idle"></span><span id="status">Not started</span></div>
  </section>

  <section class="ctl">
    <div class="zoomrow">
      <label for="zoom"><span>Field of view / zoom</span> <b id="zoomVal">1.0×</b></label>
      <input type="range" id="zoom" min="1" max="4" step="0.1" value="1">
      <small id="zoomNote"></small>
    </div>

    <details class="settings">
      <summary>Camera settings</summary>
      <div class="fields">
        <label>Camera
          <select id="cam" aria-label="Camera"><option value="">Auto (prefer rear camera)</option></select>
        </label>
        <label>Resolution
          <select id="res" aria-label="Resolution">
            <option value="1280x720">720p (16:9)</option>
            <option value="1280x960">960p (4:3, wider view)</option>
            <option value="1920x1440">1440p (4:3, wider view)</option>
            <option value="1920x1080">1080p (small codes / long range)</option>
            <option value="640x480">480p (saves bandwidth)</option>
          </select>
        </label>
        <label>Transport
          <select id="mode" aria-label="Transport">
            <option value="auto">Auto (compatibility mode if WebRTC fails)</option>
            <option value="ws">Compatibility mode only (JPEG over WebSocket)</option>
            <option value="rtc">WebRTC only</option>
          </select>
        </label>
      </div>
    </details>

    <div class="actions">
      <button id="torch" type="button">Turn torch on</button>
      <button id="start" type="button" data-on="0">Start sending</button>
    </div>
  </section>
</main>
<script src="phone.js"></script>
</body>
</html>
